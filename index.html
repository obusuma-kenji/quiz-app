<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森先生の成果を出すのはAorB</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; background: #f0f0f8; min-height: 100vh; }
.header { background: #4b44c8; color: white; padding: 14px 18px; display: flex; align-items: center; gap: 10px; }
.header-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
.header-icons { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.2); border: none; color: white; cursor: pointer; font-size: 14px; }
.progress-bar-wrap { background: #d8d6f0; height: 6px; }
.progress-bar { background: #4b44c8; height: 6px; transition: width 0.4s; }
.container { max-width: 600px; margin: 0 auto; padding: 1rem; }
.meta { display: flex; justify-content: space-between; padding: 10px 0 14px; font-size: 13px; color: #666; }
.correct-count { color: #4b44c8; font-weight: 600; }
.card { background: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.q-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.q-badge { background: #4b44c8; color: white; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
.q-tag { background: #ede9fa; color: #4b44c8; font-size: 12px; padding: 3px 10px; border-radius: 20px; }
.question-text { font-size: 15px; line-height: 1.8; border-left: 3px solid #b3acf0; padding-left: 12px; }
.choice-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.choice-btn {
  width: 100%; padding: 16px 18px; border: 2px solid #c8c4f0; border-radius: 10px;
  background: white; font-size: 15px; font-weight: 500; cursor: pointer;
  text-align: left; display: flex; align-items: flex-start; gap: 12px;
  transition: background 0.15s, border-color 0.15s; line-height: 1.6;
}
.choice-btn:hover:not(:disabled) { background: #f0eeff; border-color: #9990e0; }
.choice-label { font-size: 13px; font-weight: 700; color: #4b44c8; background: #ede9fa; padding: 2px 8px; border-radius: 6px; flex-shrink: 0; margin-top: 2px; }
.choice-btn.correct { background: #e8f9f0; border-color: #2ecc71; }
.choice-btn.correct .choice-label { background: #2ecc71; color: white; }
.choice-btn.wrong { background: #fef0f0; border-color: #e74c3c; }
.choice-btn.wrong .choice-label { background: #e74c3c; color: white; }
.choice-btn.reveal-correct { background: #e8f9f0; border-color: #2ecc71; }
.choice-btn.reveal-correct .choice-label { background: #2ecc71; color: white; }
.choice-btn:disabled { cursor: default; }
.feedback { border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-size: 14px; line-height: 1.7; display: none; }
.feedback.correct { background: #e8f9f0; color: #1a5c38; border: 1px solid #a3d9b8; }
.feedback.wrong { background: #fef0f0; color: #8b1a1a; border: 1px solid #f5c0c0; }
.nav-row { display: flex; gap: 8px; flex-wrap: wrap; }
.nav-btn { flex: 1; min-width: 80px; padding: 12px 8px; border: 2px solid #c8c4f0; border-radius: 10px; background: white; font-size: 14px; font-weight: 600; color: #4b44c8; cursor: pointer; transition: background 0.15s; }
.nav-btn:hover { background: #ede9fa; }
.nav-btn.primary { background: #4b44c8; color: white; border-color: #4b44c8; }
.nav-btn.primary:hover { background: #3d37a8; }
.nav-btn:disabled { opacity: 0.35; cursor: default; }
.result-screen { text-align: center; padding: 3rem 1rem; display: none; }
.result-score { font-size: 56px; font-weight: 700; color: #4b44c8; }
.result-label { font-size: 16px; color: #666; margin: 8px 0 8px; }
.result-msg { color: #888; font-size: 14px; margin-bottom: 28px; }
.btn-retry { background: #4b44c8; color: white; border: none; padding: 14px 36px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="header">
  <span style="font-size:20px;">📖</span>
  <span class="header-title">森先生の成果を出すのはAorB</span>
  <div class="header-icons">
    <button class="icon-btn" title="シャッフル" onclick="doShuffle()">⇄</button>
    <button class="icon-btn" title="スタートに戻る" onclick="restart()">↺</button>
  </div>
</div>
<div class="progress-bar-wrap"><div class="progress-bar" id="prog"></div></div>

<div class="container">
  <div id="quiz-area">
    <div class="meta">
      <span id="q-count">問題 1 / 50</span>
      <span class="correct-count" id="c-count">正解：0 問</span>
    </div>
    <div class="card">
      <div class="q-header">
        <span class="q-badge" id="q-label">Q1</span>
        <span class="q-tag" id="q-tag"></span>
      </div>
      <p class="question-text" id="q-text"></p>
    </div>

    <div class="choice-row" id="choice-row"></div>
    <div class="feedback" id="feedback"></div>

    <div class="nav-row">
      <button class="nav-btn" id="btn-prev" onclick="goPrev()">◀ 前へ</button>
      <button class="nav-btn primary" id="btn-next" onclick="goNext()" style="display:none;">次へ ▶</button>
      <button class="nav-btn" id="btn-restart" onclick="restart()" title="スタートに戻る">🔄 最初から</button>
    </div>
  </div>

  <div class="result-screen" id="result-screen">
    <div class="result-score" id="res-score"></div>
    <div class="result-label" id="res-total">/ 50 問正解</div>
    <p class="result-msg" id="res-msg"></p>
    <button class="btn-retry" onclick="restart()">もう一度チャレンジ</button>
  </div>
</div>

<script>
const quizData = [
  { tag:"成功の方程式", q:"成果を最大化する方程式として正しいのはどちら？", choices:["結果 ＝ 質 × 量²","結果 ＝ 質 ＋ 量"], answer:0 },
  { tag:"成功の方程式", q:"量が「2乗」で効いてくる理由として正しいのはどちら？", choices:["量が増えるほど結果が曲線的（指数関数的）に増大するから","量が増えても結果への影響は一定だから"], answer:0 },
  { tag:"夢・目標", q:"将来の夢が見つからない時の行動基準として正しいのはどちら？", choices:["自分が「ときめく」もの、興味を惹かれるものを大事にする","周りの人が勧めるものを基準に行動する"], answer:0 },
  { tag:"現代の行動", q:"憧れの人に相談したい時、現代で推奨される行動はどちら？", choices:["インスタのDMなどで直接連絡を取ってみる","有名人だから諦めて間接的な情報収集だけする"], answer:0 },
  { tag:"心技体", q:"「心技体」でパフォーマンスの土台となる要素はどちら？", choices:["心（考え方やメンタル）","技（スキルや技術）"], answer:0 },
  { tag:"心技体", q:"指の長さが変わるワークが示す心と体の関係はどちら？", choices:["心が変われば体（物理的状態）まで変わる","体を鍛えれば心も自然についてくる"], answer:0 },
  { tag:"習慣・記憶", q:"一度身につけた感覚や知識を定着させるために必要なのはどちら？", choices:["毎日コツコツ継続し、短期記憶を長期記憶に定着させる","集中して一気に詰め込む"],  answer:0 },
  { tag:"エネルギー", q:"試合前の「礼」のエネルギー的な意味として正しいのはどちら？", choices:["天とつながりチャクラを通じてエネルギーを取り入れる","相手への敬意を示す形式的な動作である"], answer:0 },
  { tag:"エネルギー", q:"エネルギーの法則として正しいのはどちら？", choices:["先に感謝やエネルギーを「出す」と自分に「入って」くる","まず自分がもらってから相手に返す"], answer:0 },
  { tag:"健康・姿勢", q:"授業前に足裏を床につけて姿勢を正すメリットはどちら？", choices:["舌が正しい位置につき呼吸が深くなり病気になりにくくなる","背筋が伸びるだけで特に健康効果はない"], answer:0 },
  { tag:"メンタル", q:"肩を上げてストンと落とす動作で意識すべきことはどちら？", choices:["肩甲骨を後ろでくっつけること","首の力を抜くこと"], answer:0 },
  { tag:"メンタル", q:"本番で緊張した時に唱えるべき合言葉はどちら？", choices:["マイナス × マイナス ＝ プラス","冷静に、落ち着いて、ゆっくり"], answer:0 },
  { tag:"集中・呼吸", q:"呼吸法で鼻から吸うことが推奨される理由はどちら？", choices:["鼻を通ることで空気が冷やされ脳をクールダウンできるから","鼻から吸う方が口より深く吸えるから"], answer:0 },
  { tag:"集中・呼吸", q:"「5・3・8呼吸法」の正しい手順はどちら？", choices:["5秒吸い・3秒止め・8秒かけてゆっくり吐く","3秒吸い・5秒止め・8秒かけてゆっくり吐く"], answer:0 },
  { tag:"集中・呼吸", q:"「落ちてくく」のイメージの正しい意味はどちら？", choices:["気を下に降ろし意識を落ち着かせること","肩の力を抜いて上半身をリラックスさせること"], answer:0 },
  { tag:"エネルギー", q:"へその下にあるエネルギーの拠点の正しい名称はどちら？", choices:["丹田（たんでん）","第三チャクラ"], answer:0 },
  { tag:"集中・マインド", q:"「音3つ見つけ」ワークの目的として正しいのはどちら？", choices:["意識を「今、ここ」に引き戻し心を整えること","聴覚を鍛えて周囲の情報を素早くキャッチすること"], answer:0 },
  { tag:"集中・マインド", q:"特定の対象に意識を絞る集中力の名称はどちら？", choices:["一点集中（フォーカス）","全体集中（コンセントレーション）"], answer:0 },
  { tag:"集中・マインド", q:"周囲の状況を広く捉える集中力の名称はどちら？", choices:["全体集中（コンセントレーション）","一点集中（フォーカス）"], answer:0 },
  { tag:"集中・マインド", q:"一点集中と全体集中を日常で交互に鍛えるトレーニング例はどちら？", choices:["食事中に一品に集中することと全体の献立を見ることを繰り返す","音楽を聴きながら読書をして二つに同時に集中する"], answer:0 },
  { tag:"学び方", q:"何かを習得する際の基本的な心がけとして正しいのはどちら？", choices:["ゆっくり、丁寧に、心を込めて","速く、大量に、効率よく"], answer:0 },
  { tag:"PREP法", q:"「PREP法」の「P（Point）」が指すものはどちら？", choices:["結論・要点（まず何を伝えたいか）","問題提起（何が課題かを示す）"], answer:0 },
  { tag:"PREP法", q:"「PREP法」の「R（Reason）」が指すものはどちら？", choices:["理由（なぜならば、という根拠）","結果（どうなったかを示す）"], answer:0 },
  { tag:"PREP法", q:"「PREP法」の「E（Example）」が指すものはどちら？", choices:["具体的な例（相手に映像が浮かぶエピソード）","エビデンス（統計や数値データ）"], answer:0 },
  { tag:"コミュニケーション", q:"相手に感動してもらう話し方のコツはどちら？", choices:["相手の脳内に「映像」が浮かぶように具体的に話す","論理的に順序立てて抽象的に話す"], answer:0 },
  { tag:"整理整頓", q:"「整理」の最初にすべき行動として正しいのはどちら？", choices:["いるものといらないものを分けいらないものを捨てる","すべてのものをきれいに並べて収納する"], answer:0 },
  { tag:"整理整頓", q:"「整頓」の正しい定義はどちら？", choices:["必要なものをいつでも取り出せるよう決まった場所に置く","不要なものを見えないところに隠す"], answer:0 },
  { tag:"成長・進化", q:"森氏が定義する「成長」として正しいのはどちら？", choices:["できなかったことができるようになること","できることをより速く正確にできるようになること"], answer:0 },
  { tag:"成長・進化", q:"森氏が定義する「進化」として正しいのはどちら？", choices:["成果を繰り返し一段上のステージへ上がること","毎日少しずつ改善を積み重ねること"], answer:0 },
  { tag:"試合・挑戦", q:"試合（試し合い）の目的として正しいのはどちら？", choices:["結果を出すことと課題を見つけること","勝つことと相手の弱点を探すこと"], answer:0 },
  { tag:"試合・挑戦", q:"一流アスリートがミス時にニヤリと笑う理由はどちら？", choices:["伸びしろ（課題）を発見し成長のチャンスと捉えているから","緊張を和らげるためのルーティンだから"], answer:0 },
  { tag:"メンタル", q:"試験前に脳をリラックスさせるアファーメーションはどちら？", choices:["「簡単、簡単」","「できる、できる」"], answer:0 },
  { tag:"成功イメージ", q:"「成功は2度起きる」の意味として正しいのはどちら？", choices:["頭の中（イメージ）で成功し次に現実で成功する","一度の成功を繰り返し体に染み込ませる"], answer:0 },
  { tag:"集中・動作", q:"ジャグリングの練習で冷静さを保つ秘訣はどちら？", choices:["一つ一つの動作を「丁寧」に行うこと","速さを意識して反射的に動くこと"], answer:0 },
  { tag:"時間の考え方", q:"物理学者の視点に基づく時間の考え方として正しいのはどちら？", choices:["「過去は関係なく今しかない」という考え方","「過去の経験が未来を決める」という考え方"], answer:0 },
  { tag:"言葉の力", q:"運を引き寄せるために1日10回以上唱えると良い言葉はどちら？", choices:["「俺（私）って幸せだなぁ」","「今日もいい日になる」"], answer:0 },
  { tag:"自己信頼", q:"誰も見ていない場所でゴミ拾いをすることが自信につながる理由はどちら？", choices:["見えないところで善いことをしている自分を自分自身が好きになれるから","善い行動は必ず誰かに見られていて評価されるから"], answer:0 },
  { tag:"メンタル", q:"頭が真っ白になった時に客観性を取り戻すテクニックはどちら？", choices:["自分の状況を心の中で「実況中継」すること","目を閉じて深呼吸を10回くり返すこと"], answer:0 },
  { tag:"教育", q:"「減点主義」の弊害として述べられているのはどちら？", choices:["「弱み」ばかりにフォーカスしてしまいがちになること","「強み」への過信が生まれてしまうこと"], answer:0 },
  { tag:"強みの活かし方", q:"社会で活躍するためにフォーカスすべきはどちら？", choices:["自分の「強み」や「いいところ」","自分の「弱み」を克服すること"], answer:0 },
  { tag:"習慣化", q:"「イフデン（If-Then）法」の正しい説明はどちら？", choices:["「もし〜したら、その時に〜する」と行動タイミングを固定する","「もしできなかったら、ペナルティを課す」と自分を律する"], answer:0 },
  { tag:"視野トレーニング", q:"視野を広げるトレーニングで眼球を動かす際のポイントはどちら？", choices:["眼を動かさず目だけでターゲットを「心でタッチ」するように追う","できるだけ速く眼球を動かしてターゲットを追う"], answer:0 },
  { tag:"視野トレーニング", q:"周辺視野が広がることのスポーツでの利点はどちら？", choices:["ボールに集中しながら相手や味方の動きを同時に把握できる","自分のフォームを意識しながら全体の戦況を読める"], answer:0 },
  { tag:"心身の繋がり", q:"体の不調を治したい時にまずアプローチすべき場所はどちら？", choices:["心（正しいこと）","体（ストレッチや運動）"], answer:0 },
  { tag:"心身の繋がり", q:"心を元気にしたい時にアプローチすべき場所はどちら？", choices:["体（を楽にすること、動かすこと）","心（ポジティブな言葉を唱えること）"], answer:0 },
  { tag:"目標設定", q:"高校3年間の卒業時に達成すべき2つの目標として正しいのはどちら？", choices:["自分を好きになることと学ぶことが楽しいと思えること","成績上位10%に入ることと部活で結果を出すこと"], answer:0 },
  { tag:"学ぶ姿勢", q:"「学ぶことが楽しい」と思うことが重要な理由はどちら？", choices:["大人の平均勉強時間は1日6分、学び続ける力が一生の武器になるから","学校の成績が将来の収入に直結するから"], answer:0 },
  { tag:"メンタル", q:"プレッシャーがかかる場面で力を入れるべき場所はどちら？", choices:["お腹（丹田）","両手のこぶし"], answer:0 },
  { tag:"集中・呼吸", q:"授業前のインプット効率を高めるためにすべきことはどちら？", choices:["姿勢を正し呼吸を整え周囲の音を3つ見つけて心を「今」に置く","事前に教科書を速読して内容を予習しておく"], answer:0 },
  { tag:"自己価値観", q:"「ときめき」を大切にすべき最大の理由はどちら？", choices:["答えは親でも先生でもなく自分自身の中にしか存在しないから","自分の好きなことを仕事にした方が収入が高くなりやすいから"], answer:0 }
];

const total = quizData.length;
let order = [...Array(total).keys()];
let idx = 0, correct = 0;
let answered = new Array(total).fill(null); // null=未回答, true=正解, false=不正解

function doShuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  restart();
}

function render() {
  const qi = order[idx];
  const q = quizData[qi];
  document.getElementById('q-count').textContent = `問題 ${idx+1} / ${total}`;
  document.getElementById('c-count').textContent = `正解：${correct} 問`;
  document.getElementById('q-label').textContent = `Q${idx+1}`;
  document.getElementById('q-tag').textContent = q.tag;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog').style.width = ((idx / total) * 100) + '%';

  const choiceRow = document.getElementById('choice-row');
  choiceRow.innerHTML = '';
  const labels = ['A', 'B'];
  q.choices.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${labels[i]}</span><span>${text}</span>`;
    btn.onclick = () => selectAnswer(i);
    choiceRow.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-prev').disabled = (idx === 0);

  // 既回答の場合は状態を復元
  if (answered[qi] !== null) {
    restoreAnswered(qi);
  }
}

function selectAnswer(chosen) {
  const qi = order[idx];
  const q = quizData[qi];
  if (answered[qi] !== null) return;

  const isCorrect = chosen === q.answer;

  // 正解数の更新（初回回答のみ）
  if (answered[qi] === null) {
    if (isCorrect) correct++;
    answered[qi] = isCorrect;
  }

  restoreAnswered(qi, chosen);
}

function restoreAnswered(qi, chosen) {
  const q = quizData[qi];
  const btns = document.getElementById('choice-row').querySelectorAll('.choice-btn');
  const wasCorrect = answered[qi];

  // chosen が渡されなければ answer から逆引き（前へ戻った時）
  const selectedIdx = (chosen !== undefined) ? chosen : (wasCorrect ? q.answer : (q.answer === 0 ? 1 : 0));

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('reveal-correct');
    if (i === selectedIdx && i !== q.answer) btn.classList.add('wrong');
    if (i === selectedIdx && i === q.answer) { btn.classList.remove('reveal-correct'); btn.classList.add('correct'); }
  });

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  if (wasCorrect) {
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！';
  } else {
    fb.className = 'feedback wrong';
    fb.textContent = `✕ 不正解。正解は「${['A','B'][q.answer]}: ${q.choices[q.answer]}」`;
  }

  document.getElementById('btn-next').style.display = (idx < total - 1) ? 'block' : 'none';
  if (idx === total - 1 && answered[qi] !== null) {
    document.getElementById('btn-next').style.display = 'block';
    document.getElementById('btn-next').textContent = '結果を見る ▶';
  } else {
    document.getElementById('btn-next').textContent = '次へ ▶';
  }
}

function goNext() {
  idx++;
  if (idx >= total) { showResult(); return; }
  render();
}

function goPrev() {
  if (idx <= 0) return;
  idx--;
  render();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('res-score').textContent = correct;
  document.getElementById('res-total').textContent = `/ ${total} 問正解`;
  const pct = correct / total;
  let msg = 'もう少し復習しましょう！';
  if (pct >= 0.9) msg = '完璧！ほぼ全問正解です！';
  else if (pct >= 0.7) msg = '素晴らしい！よく頑張りました！';
  else if (pct >= 0.5) msg = '半分以上クリア！あと少し！';
  document.getElementById('res-msg').textContent = msg;
  document.getElementById('prog').style.width = '100%';
}

function restart() {
  idx = 0; correct = 0;
  answered = new Array(total).fill(null);
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  render();
}

render();
</script>
</body>
</html>
