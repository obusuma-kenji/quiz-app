<head>

<style>

body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; background: #f0f0f8; min-height: 100vh; }
.header { background: #4b44c8; color: white; padding: 14px 18px; display: flex; align-items: center; gap: 10px; }

.q-badge { background: #4b44c8; color: white; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }

.question-text { font-size: 15px; line-height: 1.8; border-left: 3px solid #b3acf0; padding-left: 12px; }
.choice-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.choice-btn { width: 100%; padding: 16px 18px; border: 2px solid #c8c4f0; border-radius: 10px; background: white; font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; display: flex; align-items: flex-start; gap: 12px; transition: background 0.15s, border-color 0.15s; line-height: 1.6; }
.choice-btn:hover:not(:disabled) { background: #f0eeff; border-color: #9990e0; }
.choice-label { font-size: 13px; font-weight: 700; color: #4b44c8; background: #ede9fa; padding: 2px 8px; border-radius: 6px; flex-shrink: 0; margin-top: 2px; }
.choice-btn.correct { background: #e8f9f0; border-color: #2ecc71; }
.choice-btn.correct .choice-label { background: #2ecc71; color: white; }
.choice-btn.wrong { background: #fef0f0; border-color: #e74c3c; }
.choice-btn.wrong .choice-label { background: #e74c3c; color: white; }

.choice-btn.reveal-correct .choice-label { background: #2ecc71; color: white; }
.choice-btn:disabled { cursor: default; }
.feedback { border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-size: 14px; line-height: 1.7; display: none; }
.feedback.correct { background: #e8f9f0; color: #1a5c38; border: 1px solid #a3d9b8; }
.feedback.wrong { background: #fef0f0; color: #8b1a1a; border: 1px solid #f5c0c0; }
.nav-row { display: flex; gap: 8px; flex-wrap: wrap; }
.nav-btn { flex: 1; min-width: 80px; padding: 12px 8px; border: 2px solid #c8c4f0; border-radius: 10px; background: white; font-size: 14px; font-weight: 600; color: #4b44c8; cursor: pointer; transition: background 0.15s; }
.nav-btn:hover { background: #ede9fa; }
.nav-btn.primary { background: #4b44c8; color: white; border-color: #4b44c8; }
.nav-btn.primary:hover { background: #3d37a8; }
.nav-btn:disabled { opacity: 0.35; cursor: default; }

/* 結果ページ */
.result-screen { display: none; padding-bottom: 2rem; }
.result-hero { text-align: center; padding: 2rem 1rem 1.5rem; }
.result-total-score { font-size: 52px; font-weight: 700; color: #4b44c8; }
.result-total-label { font-size: 15px; color: #666; margin-top: 4px; }
.result-rank { display: inline-block; margin-top: 12px; padding: 6px 20px; border-radius: 20px; font-size: 15px; font-weight: 700; }

/* レーダーチャート */
.chart-wrap { background: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center; }
.chart-title { font-size: 14px; font-weight: 600; color: #444; margin-bottom: 12px; }

/* カテゴリー別カード */
.cat-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.cat-card { background: white; border-radius: 12px; padding: 1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.cat-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cat-name { font-size: 14px; font-weight: 700; color: #333; }
.cat-score-badge { font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 20px; }
.cat-bar-wrap { background: #f0eeff; border-radius: 6px; height: 10px; margin-bottom: 10px; }
.cat-bar { height: 10px; border-radius: 6px; transition: width 0.6s; }
.cat-comment { font-size: 13px; color: #555; line-height: 1.7; }

/* 総合コメント */
.summary-card { background: #4b44c8; color: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }

.summary-text { font-size: 14px; line-height: 1.8; }

.btn-retry { background: #4b44c8; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
</style>
</head>
<body>

  { tag:"成長・進化", q:"森氏が定義する「成長」として正しいのはどちら？", choices:["できなかったことができるようになること","できることをより速く正確にできるようになること"], answer:0 },
  { tag:"成長・進化", q:"森氏が定義する「進化」として正しいのはどちら？", choices:["成果を繰り返し一段上のステージへ上がること","毎日少しずつ改善を積み重ねること"], answer:0 },

// 各問題がどのカテゴリーに属するかマッピング
function getCatIndex(tag) {
  for (let i = 0; i < CATEGORIES.length; i++) {
    if (CATEGORIES[i].tags.includes(tag)) return i;
  }
  return 0;
}

const total = quizData.length;
let order = [...Array(total).keys()];
let idx = 0;
let answered = new Array(total).fill(null);

function countCorrect() {
  return answered.filter(v => v === true).length;
}

function doShuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  restart();
}

function render() {
  const qi = order[idx];
  const q = quizData[qi];
  const correct = countCorrect();
  document.getElementById('q-count').textContent = `問題 ${idx+1} / ${total}`;
  document.getElementById('c-count').textContent = `正解：${correct} 問`;
  document.getElementById('q-label').textContent = `Q${idx+1}`;
  document.getElementById('q-tag').textContent = q.tag;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog').style.width = ((idx / total) * 100) + '%';

  const choiceRow = document.getElementById('choice-row');
  choiceRow.innerHTML = '';
  ['A','B'].forEach((lbl, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${lbl}</span><span>${q.choices[i]}</span>`;
    btn.onclick = () => selectAnswer(i);
    choiceRow.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-prev').disabled = (idx === 0);

  if (answered[qi] !== null) restoreAnswered(qi);
}

function selectAnswer(chosen) {
  const qi = order[idx];
  const q = quizData[qi];
  if (answered[qi] !== null) return;
  answered[qi] = (chosen === q.answer);
  restoreAnswered(qi, chosen);
}

function restoreAnswered(qi, chosen) {
  const q = quizData[qi];
  const btns = document.getElementById('choice-row').querySelectorAll('.choice-btn');
  const wasCorrect = answered[qi];
  const selectedIdx = (chosen !== undefined) ? chosen : (wasCorrect ? q.answer : (q.answer === 0 ? 1 : 0));

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('reveal-correct');
    if (i === selectedIdx && i !== q.answer) btn.classList.add('wrong');
    if (i === selectedIdx && i === q.answer) { btn.classList.remove('reveal-correct'); btn.classList.add('correct'); }
  });

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  if (wasCorrect) {
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！';
  } else {
    fb.className = 'feedback wrong';
    fb.textContent = `✕ 不正解。正解は「${ ['A','B'][q.answer]}: ${q.choices[q.answer]}」`;
  }

  const isLast = idx === total - 1;
  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'block';
  btnNext.textContent = isLast ? '結果を見る ▶' : '次へ ▶';
}

function goNext() {
  idx++;
  if (idx >= total) { showResult(); return; }
  render();
}

function goPrev() {
  if (idx <= 0) return;
  idx--;
  render();
}

// ===== 結果画面 =====
function calcCatScores() {
  // 各カテゴリーの正解数と問題数を集計
  const stats = CATEGORIES.map(() => ({ correct: 0, total: 0 }));
  quizData.forEach((q, qi) => {
    const ci = getCatIndex(q.tag);
    stats[ci].total++;
    if (answered[qi] === true) stats[ci].correct++;
  });
  // 10点満点に換算
  return stats.map(s => s.total > 0 ? Math.round((s.correct / s.total) * 10) : 0);
}

function drawRadar(scores) {
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) / 2 - 48;
  const n = 5;
  ctx.clearRect(0, 0, W, H);

  // グリッド
  for (let g = 1; g <= 5; g++) {
    const r = R * g / 5;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#e0ddf8';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 軸線
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i / n) - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
    ctx.strokeStyle = '#c8c4f0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // データ
  ctx.beginPath();
  scores.forEach((s, i) => {
    const a = (Math.PI * 2 * i / n) - Math.PI / 2;
    const r = R * s / 10;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(75, 68, 200, 0.18)';
  ctx.fill();
  ctx.strokeStyle = '#4b44c8';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 点
  scores.forEach((s, i) => {
    const a = (Math.PI * 2 * i / n) - Math.PI / 2;
    const r = R * s / 10;
    ctx.beginPath();
    ctx.arc(cx + r * Math.cos(a), cy + r * Math.sin(a), 5, 0, Math.PI * 2);
    ctx.fillStyle = '#4b44c8';
    ctx.fill();
  });

  // ラベル
  const labelNames = ['マインド', 'メンタル', '心技体', '学び', '行動'];
  ctx.font = '12px Hiragino Sans, Meiryo, sans-serif';
  ctx.fillStyle = '#444';
  ctx.textAlign = 'center';
  scores.forEach((s, i) => {
    const a = (Math.PI * 2 * i / n) - Math.PI / 2;
    const lr = R + 32;
    const lx = cx + lr * Math.cos(a);
    const ly = cy + lr * Math.sin(a);
    ctx.fillText(labelNames[i], lx, ly + 4);
    ctx.fillStyle = '#4b44c8';
    ctx.font = '11px Hiragino Sans, Meiryo, sans-serif';
    ctx.fillText(`${s}点`, lx, ly + 18);
    ctx.fillStyle = '#444';
    ctx.font = '12px Hiragino Sans, Meiryo, sans-serif';
  });
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';
  document.getElementById('prog').style.width = '100%';

  const catScores = calcCatScores();
  const totalCorrect = countCorrect();
  const pct = totalCorrect / total;
  const total10 = Math.round(pct * 100);

  document.getElementById('res-score').textContent = totalCorrect;
  document.getElementById('res-total-label').textContent = `/ ${total} 問正解　（${total10}点 / 100点）`;

  let rank, rankBg, rankColor;
  if (total10 >= 90) { rank = '🏆 Sランク：森先生の申し子'; rankBg = '#fff8e1'; rankColor = '#b8860b'; }
  else if (total10 >= 70) { rank = '🥇 Aランク：実践者レベル'; rankBg = '#e8f9f0'; rankColor = '#1a7a4a'; }
  else if (total10 >= 50) { rank = '🥈 Bランク：理解者レベル'; rankBg = '#e6f1fb'; rankColor = '#1a5f9a'; }
  else { rank = '📖 Cランク：学習者レベル'; rankBg = '#fef0f0'; rankColor = '#c0392b'; }

  const rankEl = document.getElementById('res-rank');
  rankEl.textContent = rank;
  rankEl.style.background = rankBg;
  rankEl.style.color = rankColor;
  rankEl.style.border = `1.5px solid ${rankColor}`;

  // レーダーチャート
  setTimeout(() => drawRadar(catScores), 100);

  // カテゴリー別カード
  const catCardsEl = document.getElementById('cat-cards');
  catCardsEl.innerHTML = '';
  CATEGORIES.forEach((cat, i) => {
    const s = catScores[i];
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `
      <div class="cat-card-header">
        <span class="cat-name">${cat.name}</span>
        <span class="cat-score-badge" style="background:${cat.light};color:${cat.color}">${s} / 10点</span>
      </div>
      <div class="cat-bar-wrap">
        <div class="cat-bar" style="width:${s*10}%;background:${cat.color}"></div>
      </div>
      <div class="cat-comment">${getCatComment(cat.id, s)}</div>
    `;
    catCardsEl.appendChild(card);
  });

  // 総合コメント
  document.getElementById('summary-text').textContent = getSummaryComment(total10, catScores);
}

function restart() {
  idx = 0;
  answered = new Array(total).fill(null);
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  render();
}

render();
