
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
#app { max-width: 600px; margin: 0 auto; padding: 1rem; }
.header { background: #4b44c8; color: white; padding: 14px 18px; border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0; display: flex; align-items: center; gap: 10px; }
.header-title { font-size: 16px; font-weight: 500; }
.header-icons { margin-left: auto; display: flex; gap: 8px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.2); border: none; color: white; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.progress-bar-wrap { background: #e2e2f0; height: 6px; }
.progress-bar { background: #4b44c8; height: 6px; transition: width 0.4s; }
.meta { display: flex; justify-content: space-between; padding: 10px 0 14px; font-size: 13px; color: var(--color-text-secondary); }
.correct-count { color: #4b44c8; font-weight: 500; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 14px; }
.q-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.q-badge { background: #4b44c8; color: white; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 20px; }
.q-tag { background: #ede9fa; color: #4b44c8; font-size: 12px; padding: 3px 10px; border-radius: 20px; }
.bookmark { margin-left: auto; font-size: 18px; cursor: pointer; color: var(--color-text-secondary); }
.question-text { font-size: 15px; line-height: 1.7; color: var(--color-text-primary); border-left: 3px solid #b3acf0; padding-left: 12px; }
.answer-card { background: #e8f9f0; border: 0.5px solid #a3d9b8; border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 14px; display: none; }
.answer-label { font-size: 12px; color: #2e7d52; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.answer-text { font-size: 15px; line-height: 1.7; color: #1a5c38; }
.btn-row { display: flex; gap: 10px; }
.btn { flex: 1; padding: 14px; border: none; border-radius: var(--border-radius-lg); font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
.btn:hover { opacity: 0.88; }
.btn-correct { background: #2ecc71; color: white; }
.btn-wrong { background: #e74c3c; color: white; }
.btn-show { background: #4b44c8; color: white; width: 100%; padding: 14px; border: none; border-radius: var(--border-radius-lg); font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 10px; }
.result-screen { text-align: center; padding: 2rem 1rem; display: none; }
.result-score { font-size: 48px; font-weight: 500; color: #4b44c8; }
.result-label { font-size: 16px; color: var(--color-text-secondary); margin: 8px 0 24px; }
.btn-retry { background: #4b44c8; color: white; border: none; padding: 14px 32px; border-radius: var(--border-radius-lg); font-size: 15px; font-weight: 500; cursor: pointer; }
</style>

<div id="app">
  <div class="header">
    <span style="font-size:20px;">📖</span>
    <span class="header-title">学習クイズ</span>
    <div class="header-icons">
      <button class="icon-btn" title="一覧">☰</button>
      <button class="icon-btn" onclick="shuffle()">⇄</button>
      <button class="icon-btn" onclick="restart()">↺</button>
    </div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="prog"></div></div>

  <div id="quiz-area">
    <div class="meta">
      <span id="q-count">問題 1 / 10</span>
      <span class="correct-count" id="c-count">正解：0 問</span>
    </div>
    <div class="card">
      <div class="q-header">
        <span class="q-badge" id="q-label">Q1</span>
        <span class="q-tag" id="q-tag">夢・目標</span>
        <span class="bookmark" id="bm">🔖</span>
      </div>
      <p class="question-text" id="q-text"></p>
    </div>
    <div class="answer-card" id="ans-card">
      <div class="answer-label">💡 解答</div>
      <p class="answer-text" id="ans-text"></p>
    </div>
    <button class="btn-show" id="show-btn" onclick="showAnswer()">解答を見る</button>
    <div class="btn-row" id="judge-btns" style="display:none;">
      <button class="btn btn-correct" onclick="judge(true)">✓ 正解</button>
      <button class="btn btn-wrong" onclick="judge(false)">✕ 不正解</button>
    </div>
  </div>

  <div class="result-screen" id="result-screen">
    <div class="result-score" id="res-score"></div>
    <div class="result-label">/ 10 問正解</div>
    <p style="color:var(--color-text-secondary);font-size:14px;margin-bottom:24px;" id="res-msg"></p>
    <button class="btn-retry" onclick="restart()">もう一度チャレンジ</button>
  </div>
</div>

<script>
const quizData = [
  { tag:"夢・目標", q:"将来の夢が見つからない時、何を基準に行動すれば良いと述べられていますか？", a:"自分が「ときめく」もの、興味を惹かれるものを大事にすること。" },
  { tag:"夢・目標", q:"夢を実現するために最初に大切なことは何だと述べられていますか？", a:"まず「やりたいこと」を言葉にして、具体的なイメージを持つこと。" },
  { tag:"行動・習慣", q:"目標達成のために毎日続けるべき最も重要な習慣は何ですか？", a:"小さな一歩を毎日積み重ねること。継続こそが力になる。" },
  { tag:"行動・習慣", q:"失敗したときに大切にすべき考え方として述べられているのは何ですか？", a:"失敗は成長のための学びであり、次への糧と捉えること。" },
  { tag:"人間関係", q:"人との出会いを大切にするために心がけるべきことは何ですか？", a:"相手の話をしっかり聞き、感謝の気持ちを忘れないこと。" },
  { tag:"人間関係", q:"信頼関係を築くために最も重要なことは何だと述べられていますか？", a:"約束を守り、言葉と行動を一致させること。" },
  { tag:"自己成長", q:"自分を変えたいと思った時、まず取り組むべきことは何ですか？", a:"今の自分を客観的に見つめ直し、変えたい点を一つ決めること。" },
  { tag:"自己成長", q:"読書が自己成長に役立つ理由として挙げられているのは何ですか？", a:"他者の経験や知恵を手軽に吸収でき、視野が広がるから。" },
  { tag:"メンタル", q:"不安や恐れを感じた時にどのように対処すれば良いと述べられていますか？", a:"不安の正体を書き出し、自分でコントロールできることに集中すること。" },
  { tag:"メンタル", q:"前向きな気持ちを保つために日々実践できることは何ですか？", a:"感謝できることを毎晩三つ書き留める習慣を持つこと。" }
];

let order = [...Array(10).keys()];
let idx = 0, correct = 0;

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  restart();
}

function render() {
  const q = quizData[order[idx]];
  document.getElementById('q-count').textContent = `問題 ${idx+1} / 10`;
  document.getElementById('c-count').textContent = `正解：${correct} 問`;
  document.getElementById('q-label').textContent = `Q${idx+1}`;
  document.getElementById('q-tag').textContent = q.tag;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('ans-text').textContent = q.a;
  document.getElementById('ans-card').style.display = 'none';
  document.getElementById('show-btn').style.display = 'block';
  document.getElementById('judge-btns').style.display = 'none';
  document.getElementById('prog').style.width = ((idx / 10) * 100) + '%';
}

function showAnswer() {
  document.getElementById('ans-card').style.display = 'block';
  document.getElementById('show-btn').style.display = 'none';
  document.getElementById('judge-btns').style.display = 'flex';
}

function judge(ok) {
  if (ok) correct++;
  idx++;
  if (idx >= 10) {
    showResult();
  } else {
    render();
  }
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';
  document.getElementById('res-score').textContent = correct;
  const msgs = ['もう少し復習しましょう！', '半分クリア！あと少し！', 'よく頑張りました！', '素晴らしい！ほぼ満点です！', '完璧です！全問正解！'];
  document.getElementById('res-msg').textContent = msgs[Math.min(Math.floor(correct/2.5), 4)];
  document.getElementById('prog').style.width = '100%';
}

function restart() {
  idx = 0; correct = 0;
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  render();
}

render();
</script>
